<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Directory | Flora of SXC</title>
<meta name="description" content="Browse the full directory of trees documented across the St. Xavier's College campus with botanical names, families, and images.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .directory-hero {
    padding: 150px 24px 60px;
    text-align: center;
    background: linear-gradient(160deg, var(--leaf-900), var(--leaf-600));
    color: #fff;
  }
  .directory-hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 12px; }
  .directory-hero p { color: rgba(255,255,255,0.85); max-width: 560px; margin: 0 auto; }
</style>
</head>
<body data-page="trees">

<div id="page-transition"><div class="leaf-spinner">🍃</div></div>
<div id="header-mount"></div>

<section class="directory-hero">
  <h1 class="reveal is-visible"><i class="fa-solid fa-tree"></i> Tree Directory</h1>
  <p class="reveal is-visible">
    Explore the plants and trees documented across the St. Xavier's College campus. Discover their names, stories, characteristics and traditional uses.
  </p>
</section>

<section class="section">
  <div class="filter-bar reveal">
    <input type="search" name="" placeholder="Search by common or scientific name..." id="search-input" aria-label="Search plants">
    <select name="" aria-label="Filter by plant type" id="type-filter">
      <option value="">All Plant Types</option>
      <option value="Tree">Tree</option>
      <option value="Shrub">Shrub</option>
      <option value="Herb">Herb</option>
    </select>
  </div>
  <p class="result-count" id="result-count"></p>
  <div class="tree-grid" id="tree-grid">
    <div class="loading-state">
      <div class="spinner"></div>
      Loading the Campus Directory...
    </div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/trees-directory.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
</body>
</html>
